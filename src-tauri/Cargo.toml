[package]
name = "mentaliis"
version = "0.1.0"
description = "Mentaliis — un second cerveau spatial."
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
# Requis par `generate_context!` des que la configuration porte des plugins.
serde_json = "1"

# La mise a jour automatique ne concerne que les systemes de bureau.
[target."cfg(any(target_os = \"windows\", target_os = \"macos\", target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
# Utilise par `tauri dev` pour desactiver certaines optimisations.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
