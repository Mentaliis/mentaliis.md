[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mentaliis-engine"
version = "0.1.0"
description = "Moteur local de Mentaliis : gestion du Vault, markdown, index et recherche."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-frontmatter>=1.1",
    "python-multipart>=0.0.9",
    "watchfiles>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
mentaliis-engine = "mentaliis_engine.main:run"

[tool.setuptools.packages.find]
include = ["mentaliis_engine*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
